<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
					xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
		<meta charset="UTF-8">
		<title> Book Management System </title>
		<link rel="stylesheet" th:href="@{/css/styles.css}">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
	</head>
	<body>
		<div class ="container">
			<div class="row">
				<div  style="text-align:center;">
					<h1 id="banner"> Books Library System </h1>
				</div>
			</div>

			<br>

			<div class="row"></div>
			<div class ="row">
				<div class="col-md-4">
					<a th:href="@{/books/new}" class="btn btn-primary btn-sm mb-3">Add Book</a>
					<a th:href="@{/users/books}" class="btn btn-primary btn-sm mb-3">Books added by you</a>
				</div>
				<div class="col-md-4" style="color:purple">
					<h5 th:if="${session.containsKey('name')}" th:text="${session.name}"></h5>
<!--					<p>Role: <span sec:authentication="principal.authorities"></span></p>-->
				</div>
				<div class="col-md-2">
					<a th:href="@{/users/logout}" class="btn btn-primary btn-sm mb-3">Logout</a>
				</div>
				<div class="col-md-2">
					<div class="book-icon">
						<a th:href="@{/books/bookmarks}" class="btn btn-primary pull-right"> All Bookmarks </a></div>
				</div>
			</div>

			<div class="thickLine"> </div>
			<br>

			<div class ="row">
				<table class="table table-striped table-bordered ">
					<thead class= "table-dark">
					<tr>
						<th> Book Title</th>
						<th> Book image_url</th>
						<th> Book publication_year</th>
						<th> Book publishers</th>
						<th> Book book_genre_id</th>
						<th> Book amazon_rating</th>
						<th> Book authors</th>
						<th> Action </th>
						<th> Action </th>
						<th> Action </th>
					</tr>
					</thead>
					<tbody>
						<tr th:each="book : ${books}">
						<td th:text="${book.title}"> </td>
						<td>
						   <img  th:src="@{${book.image_url}}" width="120" />
						</td>
						<td  th:text="${book.publicationYear}"> </td>
						<td  th:text="${book.publisherNames}"> </td>
						<td  th:text="${book.genre}"> </td>
						<td  th:text="${book.amazonRating}"> </td>
						<td  th:text="${book.authorNames}"></td>
						<td>
							<a th:href = "@{/books/{id}(id=${book.id})}" class ="btn btn-primary">Update</a>
						</td>
						<td>
							<a th:href = "@{/books/resource/{id}(id=${book.id})}" class ="btn btn-primary">Delete</a>
						</td>
						<td>
							<a th:href="@{/books/bookmark/{id}(id=${book.id})}" class="btn btn-primary btn-sm mb-3">Bookmark</a>
						</td>
						</tr>
					</tbody>
				</table>

				<br>
				<div class="thickLine"> </div>
				<br>
			</div>
		</div>
	</body>
</html>
