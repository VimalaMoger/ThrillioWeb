<!DOCTYPE html>
<html xmlns: xmlns:th="http://www.w3.org/1999/xhtml" th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Login Form</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
    </head>
    <body>
        <div class="container">
          <div class="wrapper">
            <h1 id="banner">Login Form</h1>
            <br>

            <div class="row">

              <form th:action="@{/users}" th:object="${loginForm}" method="post">

                  <p th:if="${error}" th:text="${error}" class="error"></p>

                  <p th:if="${logout}" th:text="${logout}" class="logout"></p>

                  <br>

                  <div class="form-group">
                      <label>User Email</label>
                      <input type="text" name="email" th:field="*{email}" placeholder="E-mail" required />

                      <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error" ></span>
                  </div>
                  <br>
                  <div class="form-group">
                      <label> User password</label>
                      <input type ="password" name ="password" th:field="*{password}" required />
                  </div>

                  <div class = "form-group">
                      <button type="submit" class = "btn btn-primary" > Login </button>
                  </div>

                  <br>

                  <div class="thickLine"> </div>

                    <div  class="form-group">
                        <span> New User? <a  th:href="@{/users/new}" >Register here</a></span>
                    </div>
                   <label>
                       <input type="checkbox" name="remember-me" />remember me
                   </label>
              </form>
            </div>
          </div>
        </div>
    </body>
</html>
