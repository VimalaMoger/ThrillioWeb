<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Book Management System</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    </head>
    <body>
        <div class ="container">
            <div class="row">
                <div style="text-align:center;">
                    <h1 id="banner"> User Books </h1>
                    <p class="book-icon"> - added by you</p>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6" style="text-align:right;font-weight:bold;color:purple">
                    <h5 th:if = "${session.containsKey('name')}" th:text = "${session.name}"></h5>
                </div>
                <div class="col-md-6">
                    <a th:href="@{/users/logout}" class="btn btn-primary pull-right">Logout</a>
                </div>
            </div>

            <div class="thickLine"> </div>

            <div class = "row">
                <p th:if="${error}" th:text="${error}" class="error">No error</p>

                <table class ="table table-striped table-bordered">
                    <thead class = "table-dark">
                        <tr>
                            <th> Book Title</th>
                            <th> Book image_url</th>
                            <th> Book publication_year</th>
                            <th> Book publishers</th>
                            <th> Book book_genre_id</th>
                            <th> Book amazon_rating</th>
                            <th> Book authors</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${books}">
                            <td th:text="${book.title}"> </td>
                            <td><img  th:src="@{${book.image_url}}" width="120" /></td>
                            <td  th:text="${book.publicationYear}"> </td>
                            <td  th:text="${book.publisherNames}"> </td>
                            <td  th:text="${book.genre}"> </td>
                            <td  th:text="${book.amazonRating}"> </td>
                            <td  th:text="${book.authorNames}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="thickLine"> </div>
            <br>

            <div style="justify-content:right">
                <a href="javascript:history.back()" class="btn btn-primary btn-sm mb-3">Previous page</a>
            </div>
        </div>
    </body>
</html>
